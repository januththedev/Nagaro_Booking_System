<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#111;color:#fff;font-family:sans-serif}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cell{position:relative}.cell img{width:100%;height:150px;object-fit:cover;display:block}.cell span{position:absolute;bottom:4px;left:6px;background:#000a;padding:2px 6px;font-size:12px}</style></head><body><div class="grid" id="g"></div><script>const files=['hero','meeting-1','meeting-2','training','auditorium','auditorium-2','coworking','coworking-2','focus','focus-2','lounge','boardroom'];document.getElementById('g').innerHTML=files.map(f=>`<div class="cell"><img src="/assets/photos/${f}.jpg"><span>${f}</span></div>`).join('');</script></body></html>
