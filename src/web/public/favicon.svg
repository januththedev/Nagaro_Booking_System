      <stop offset="0%" stop-color="#0F4A43"/>
      <stop offset="100%" stop-color="#0B3B36"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6BE7A"/>
